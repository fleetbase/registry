name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly, so a leak that lands outside CI (for example a direct push) is still caught.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with gitleaks
        # Pinned release of the official image; runs without a GITLEAKS_LICENSE so it works for
        # organisation repositories. --redact keeps any match out of the job log.
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
